        - generic [ref=f1e284]:
          - heading "Built for outcome measurement" [level=2] [ref=f1e285]
          - paragraph [ref=f1e286]: Comprehensive features for tracking employment outcomes, skill gaps, and training impact
        - generic [ref=f1e287]:
          - generic [ref=f1e288]:
            - heading "Consent-based trainee records" [level=3] [ref=f1e295]
            - paragraph [ref=f1e296]: Privacy-first onboarding with explicit consent capture via WhatsApp, email, or in person. Trainees control their data.
          - generic [ref=f1e297]:
            - heading "Employer verification" [level=3] [ref=f1e303]
            - paragraph [ref=f1e304]: Secure token-based verification links for employers to confirm employment, role, and salary band with an evidence ladder.
          - generic [ref=f1e305]:
            - heading "Wage progression & retention" [level=3] [ref=f1e310]
            - paragraph [ref=f1e311]: Track 30/90-day outcomes, 6/12/24-month retention, wage band mobility, and training relevance metrics.
          - generic [ref=f1e312]:
            - heading "Skill gap identification" [level=3] [ref=f1e318]
            - paragraph [ref=f1e319]: Capture non-placement reasons, skill mismatches, and attrition drivers to inform curriculum improvements.
          - generic [ref=f1e320]:
            - heading "Multi-programme analytics" [level=3] [ref=f1e325]
            - paragraph [ref=f1e326]: Cohort, course, provider, district, and demographic dashboards with SIDH-compatible export.
          - generic [ref=f1e327]:
            - heading "Multi-channel follow-ups" [level=3] [ref=f1e331]
            - paragraph [ref=f1e332]: Automated WhatsApp, email, and SMS follow-ups with adaptive questionnaires and no-response handling.
