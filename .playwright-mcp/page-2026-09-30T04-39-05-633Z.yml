              - generic [ref=f2e351]: "03"
              - heading "Automated follow-up" [level=3] [ref=f2e352]
            - paragraph [ref=f2e353]: Bot reaches out via WhatsApp/email. Adaptive questionnaires capture employment status, employer, role, salary.
          - generic [ref=f2e354]:
