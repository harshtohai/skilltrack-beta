              - heading "Enrol & consent" [level=3] [ref=f2e342]
            - paragraph [ref=f2e343]: Import trainees via CSV or SIDH adapter. Capture consent via WhatsApp/email bot before any tracking begins.
          - generic [ref=f2e344]:
