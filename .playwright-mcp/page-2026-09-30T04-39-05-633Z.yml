              - heading "Certify & schedule" [level=3] [ref=f2e347]
            - paragraph [ref=f2e348]: Link certifications to cohorts. Auto-schedule 30/90-day follow-ups (and 6/12/24-month for retention).
          - generic [ref=f2e349]:
