      - generic [ref=f2e283]:
        - generic [ref=f2e284]:
          - heading "Built for outcome measurement" [level=2] [ref=f2e285]
          - paragraph [ref=f2e286]: Comprehensive features for tracking employment outcomes, skill gaps, and training impact
        - generic [ref=f2e287]:
          - generic [ref=f2e288]:
            - heading "Consent-based trainee records" [level=3] [ref=f2e295]
            - paragraph [ref=f2e296]: Privacy-first onboarding with explicit consent capture via WhatsApp, email, or in person. Trainees control their data.
          - generic [ref=f2e297]:
            - heading "Employer verification" [level=3] [ref=f2e303]
            - paragraph [ref=f2e304]: Secure token-based verification links for employers to confirm employment, role, and salary band with an evidence ladder.
          - generic [ref=f2e305]:
            - heading "Wage progression & retention" [level=3] [ref=f2e310]
            - paragraph [ref=f2e311]: Track 30/90-day outcomes, 6/12/24-month retention, wage band mobility, and training relevance metrics.
          - generic [ref=f2e312]:
            - heading "Skill gap identification" [level=3] [ref=f2e318]
            - paragraph [ref=f2e319]: Capture non-placement reasons, skill mismatches, and attrition drivers to inform curriculum improvements.
          - generic [ref=f2e320]:
            - heading "Multi-programme analytics" [level=3] [ref=f2e325]
            - paragraph [ref=f2e326]: Cohort, course, provider, district, and demographic dashboards with SIDH-compatible export.
          - generic [ref=f2e327]:
            - heading "Multi-channel follow-ups" [level=3] [ref=f2e331]
            - paragraph [ref=f2e332]: Automated WhatsApp, email, and SMS follow-ups with adaptive questionnaires and no-response handling.
      - generic [ref=f2e334]:
