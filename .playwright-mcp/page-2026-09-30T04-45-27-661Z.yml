              - heading "Certify & schedule" [level=3] [ref=e348]
            - paragraph [ref=e349]: Link certifications to cohorts. Auto-schedule 30/90-day follow-ups (and 6/12/24-month for retention).
          - generic [ref=e350]:
            - generic [ref=e351]:
              - generic [ref=e352]: "03"
              - heading "Automated follow-up" [level=3] [ref=e353]
            - paragraph [ref=e354]: Bot reaches out via WhatsApp/email. Adaptive questionnaires capture employment status, employer, role, salary.
          - generic [ref=e355]:
            - generic [ref=e356]:
