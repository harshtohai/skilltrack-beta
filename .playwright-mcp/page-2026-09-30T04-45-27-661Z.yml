      - generic [ref=e284]:
        - generic [ref=e285]:
          - heading "Built for outcome measurement" [level=2] [ref=e286]
          - paragraph [ref=e287]: Comprehensive features for tracking employment outcomes, skill gaps, and training impact
        - generic [ref=e288]:
          - generic [ref=e289]:
            - heading "Consent-based trainee records" [level=3] [ref=e296]
            - paragraph [ref=e297]: Privacy-first onboarding with explicit consent capture via WhatsApp, email, or in person. Trainees control their data.
          - generic [ref=e298]:
            - heading "Employer verification" [level=3] [ref=e304]
            - paragraph [ref=e305]: Secure token-based verification links for employers to confirm employment, role, and salary band with an evidence ladder.
          - generic [ref=e306]:
            - heading "Wage progression & retention" [level=3] [ref=e311]
            - paragraph [ref=e312]: Track 30/90-day outcomes, 6/12/24-month retention, wage band mobility, and training relevance metrics.
          - generic [ref=e313]:
            - heading "Skill gap identification" [level=3] [ref=e319]
            - paragraph [ref=e320]: Capture non-placement reasons, skill mismatches, and attrition drivers to inform curriculum improvements.
          - generic [ref=e321]:
            - heading "Multi-programme analytics" [level=3] [ref=e326]
            - paragraph [ref=e327]: Cohort, course, provider, district, and demographic dashboards with SIDH-compatible export.
          - generic [ref=e328]:
            - heading "Multi-channel follow-ups" [level=3] [ref=e332]
            - paragraph [ref=e333]: Automated WhatsApp, email, and SMS follow-ups with adaptive questionnaires and no-response handling.
      - generic [ref=e335]:
        - generic [ref=e336]:
