        - generic [ref=e284]:
          - heading "Built for outcome measurement" [level=2] [ref=e285]
          - paragraph [ref=e286]: Comprehensive features for tracking employment outcomes, skill gaps, and training impact
        - generic [ref=e287]:
          - generic [ref=e288]:
            - heading "Consent-based trainee records" [level=3] [ref=e295]
            - paragraph [ref=e296]: Privacy-first onboarding with explicit consent capture via WhatsApp, email, or in person. Trainees control their data.
          - generic [ref=e297]:
            - heading "Employer verification" [level=3] [ref=e303]
            - paragraph [ref=e304]: Secure token-based verification links for employers to confirm employment, role, and salary band with an evidence ladder.
          - generic [ref=e305]:
            - heading "Wage progression & retention" [level=3] [ref=e310]
            - paragraph [ref=e311]: Track 30/90-day outcomes, 6/12/24-month retention, wage band mobility, and training relevance metrics.
          - generic [ref=e312]:
            - heading "Skill gap identification" [level=3] [ref=e318]
            - paragraph [ref=e319]: Capture non-placement reasons, skill mismatches, and attrition drivers to inform curriculum improvements.
          - generic [ref=e320]:
            - heading "Multi-programme analytics" [level=3] [ref=e325]
            - paragraph [ref=e326]: Cohort, course, provider, district, and demographic dashboards with SIDH-compatible export.
          - generic [ref=e327]:
            - heading "Multi-channel follow-ups" [level=3] [ref=e331]
            - paragraph [ref=e332]: Automated WhatsApp, email, and SMS follow-ups with adaptive questionnaires and no-response handling.
      - generic [ref=e334]:
